# Reference [optimization] section: every key, non-default values. Same format as config/config.toml.
[optimization]
target = "pir_mean"
robustness_lambda = 0.5
upside_beta = 0.25
downside_gamma = 0.1
credit_value = 3.0
cash = 2.5
max_trades = 4
unlimited_trades = false
min_players_per_turn = [3, 3]
solver = "appsi_highs"
solver_options = { threads = 1, random_seed = 7, mip_rel_gap = 0.01 }
