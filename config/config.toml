# Overrides for the built-in defaults in src/eupy/config/defaults.py. Only list what you change.
# Unknown sections/keys raise. Commented lines show the defaults.

[acquisition]
# season = "E2026"
request_delay = 0.1
# max_gap = 5
# fantasy_rounds = "all"        # or "1-4,6": one fantasy-stats fetch per round (always summed)
# fantasy_stats_type = "avg"    # "avg" | "tot", all-rounds fetch only

[transformation]
# names_mode = "continue"   # "continue" | "pause": names check reports and goes on, or stops on box-score players missing from the stats
# include_kaggle = false  # true = merge the Kaggle history under the live deltas
# base_season = "E2025"    # with include_kaggle: keep only this Kaggle season (default: unset = full history)

[logging]
# path = "logs/log.log"
# level = "INFO"

[optimization]
# Squad optimizer: `make optimize` (scripts/optimize.py). Reads data/stage_03/optimizer_input.xlsx, writes
# data/stage_99/optimizer_output.xlsx. Method and formulas: docs/optimizer.md. Commented lines show the defaults.

# -- what to maximise ---------------------------------------------------------------------------------------------
target = "pir_mean"            # workbook column to maximise, on the PIR scale (e.g. "exp_pir", "pir_mean")
# Risk weights: each term is added to the target; 0 = term off, all three 0 = plain target. Terms combine.
robustness_lambda = 0.0       # robustness: penalty per unit of pir_std              (>= 0; 0 = off)
upside_beta = 1.0             # upside: reward per unit of max(0, pir_p90 - target)  (>= 0; 0 = off)
downside_gamma = 2.0          # downside: penalty per unit of max(0, target - pir_p10) (>= 0; 0 = off)
credit_value = 0.0            # points per expected credit of price growth: 0 = ignore, 1 = a credit is worth a point,

# -- the round's rules --------------------------------------------------------------------------------------------
cash = 0.0 # credits in the bank before trading (round 1: the whole budget, 100.0)
# max_trades = 4                # max buys this round
unlimited_trades = true # true = ignore max_trades (round 1 / free windows)
min_players_per_turn = [0, 0] # [3, 3] = at least 3 turn-1 and 3 turn-2 players in the 10-man squad; [] or [0, 0] = off

# -- solver -------------------------------------------------------------------------------------------------------
# solver = "appsi_highs"        # Pyomo solver name
# solver_options = { threads = 1, random_seed = 42, mip_rel_gap = 0.0 }   # replaces the whole default dict
