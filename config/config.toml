# Overrides for the built-in defaults in src/eupy/config/defaults.py. Only list what you change.
# Unknown sections/keys raise. Commented lines show the defaults.

[acquisition]
# season = "E2026"
# request_delay = 0.3
# max_gap = 5
# fantasy_rounds = "all"        # or "1-4,6": one fantasy-stats fetch per round (always summed)
# fantasy_stats_type = "avg"    # "avg" | "tot", all-rounds fetch only

[transformation]
# names_mode = "continue"   # "continue" | "pause": names check reports and goes on, or stops on box-score players missing from the stats
# include_kaggle = false  # true = merge the Kaggle history under the live deltas
# base_season = "E2025"    # with include_kaggle: keep only this Kaggle season (default: unset = full history)

[logging]
# path = "logs/log.log"
# level = "INFO"
