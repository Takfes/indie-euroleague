# Raw datasets that no script produces: where they come from and how they are refreshed.
# Names and paths come from the script headers that consume them; only origin + refresh live here.
# `python -m eupy.registry check` fails if an unproduced raw dataset is missing here, or if an entry
# here is not an unproduced raw dataset in some header.

[datasets.optimizer_input]
origin = "prepared manually (upstream feature/prediction script not built yet)"
refresh = "manual"

[datasets.basketballsphere_prices]
origin = "no producer: its fetcher was removed; the entity resolvers still read it until the fantasy stats dataset replaces it"
refresh = "none (resolvers broken until replaced)"
