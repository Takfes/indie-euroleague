# Pipeline membership -- the one place it lives. Every script with an I/O header sits in exactly one
# pipeline (linted by `uv run python -m eupy.registry check`).
# dvc = true: the pipeline's pure scripts (`Impure: false`) become DVC steps in the generated dvc.yaml
# (`uv run python -m eupy.registry dvc`); impure scripts (fetchers, entity ingest) are never steps -- their
# outputs (raw data, verdict batch dirs) are plain deps.

[fetch_raw]
dvc = true
scripts = [
    "fetch_game_schedule",
    "fetch_euroleague_fantasy_stats",
    "fetch_kaggle_euroleague",
    "fetch_euroleague_live_boxscores",
    "fetch_euroleague_live_headers",
]

[schedule]
dvc = false
scripts = ["build_schedule_turns"]

[merge_history_live]
dvc = true
scripts = ["merge_boxscore", "merge_headers"]

[entity]
dvc = false
scripts = [
    "build_team_name_map",
    "build_player_name_map",
    "apply_player_name_verdicts",
    "normalize_fantasy_stats",
]

[optimize]
dvc = false
scripts = ["optimize_squad"]

# Wrappers: named lists of pipelines, used by the data-map HTML's pipeline/wrapper filter.
[wrappers]
all = ["merge_history_live"]
full = ["fetch_raw", "merge_history_live"]
