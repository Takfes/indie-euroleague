# Pipeline membership -- the one place it lives. Every script with an I/O header sits in exactly one
# pipeline (linted by `uv run python -m eupy.registry check`).
# dvc = true: the pipeline's pure scripts (`Impure: false`) become DVC steps in the generated dvc.yaml
# (`uv run python -m eupy.registry dvc`); impure scripts (fetchers) are never steps -- their
# outputs (raw data) are plain deps.

# The update flow's fetchers: euroleague.net box score + headers, fantasy stats (mode from config) and the schedule.
[fetch_update]
dvc = true
scripts = [
    "fetch_euroleague_live_boxscores",
    "fetch_euroleague_fantasy_stats",
    "fetch_game_schedule",
]

# The Kaggle history, a separate flow: not part of the update (see [transformation] include_kaggle).
[fetch_kaggle]
dvc = true
scripts = ["fetch_kaggle_euroleague"]

[schedule]
dvc = false
scripts = ["build_schedule_turns"]

[merge_history_live]
dvc = true
scripts = ["merge_boxscore"]

# The game headers: kept and runnable on their own (`dvc repro live_headers`), but not part of the update flows
# because nothing downstream reads them yet.
[live_headers]
dvc = true
scripts = ["fetch_euroleague_live_headers", "merge_headers"]

[entity]
dvc = true
scripts = ["build_player_name_map"]

[kpis]
dvc = false
scripts = ["build_boxscore_kpis"]

[workbook]
dvc = true
scripts = ["build_eubook"]

[optimize]
dvc = false
scripts = ["optimize_squad"]

# Wrappers: named lists of pipelines. Each is a DVC step (`dvc repro <wrapper>` runs every step of its pipelines,
# fetchers included) and a filter of the data-map HTML.
[wrappers]
# steps 1-3: fetch, merge the deltas, resolve player names (stops while stats players are unmatched)
refresh_data = ["fetch_update", "merge_history_live", "entity"]
# steps 1-4: the above, then the eubook workbook
refresh_and_build_eubook = ["fetch_update", "merge_history_live", "entity", "workbook"]
